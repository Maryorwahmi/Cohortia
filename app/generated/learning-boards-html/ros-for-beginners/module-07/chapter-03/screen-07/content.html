<div class="h-full w-full flex flex-col p-5 relative overflow-hidden cohortia-bg" data-theme="light">
  <div class="mb-3">
    <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">
      <span class="px-2 py-1 rounded-md bg-blue-50 text-blue-700 border border-blue-100">Launch</span>
      <span class="text-slate-700">Parameter & Remap</span>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4 h-full">
    <div class="rounded-2xl bg-white border p-4 shadow-sm">
      <div class="text-sm font-bold text-slate-700">Broken launch</div>
      <pre class="mt-3 bg-slate-900 text-slate-100 rounded-lg p-3 text-sm" style="white-space:pre-wrap; tab-size:2; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;">
<launch>
  <node pkg="my_pkg" type="my_node.py" name="my_node" />
  <param name="max_speed" value="1.5" />
</launch>
      </pre>
      <div class="text-xs text-slate-600 mt-2">Issue: param is global; if you wanted it private to my_node it must be nested.</div>
    </div>

    <div class="rounded-2xl bg-white border p-4 shadow-sm">
      <div class="text-sm font-bold text-slate-700">Fixed launch</div>
      <pre class="mt-3 bg-slate-900 text-slate-100 rounded-lg p-3 text-sm" style="white-space:pre-wrap; tab-size:2; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;">
<launch>
  <node pkg="my_pkg" type="my_node.py" name="my_node">
    <param name="max_speed" value="1.5" />
  </node>
</launch>
      </pre>
      <div class="text-xs text-slate-600 mt-2">Also ensure my_node.py is executable and has a shebang like #!/usr/bin/env python3.</div>
    </div>
  </div>
<style>pre, code, [class*="code"], [class*="editor"], [class*="snippet"], [class*="source"] { white-space: pre-wrap; tab-size: 2; }</style></div>
