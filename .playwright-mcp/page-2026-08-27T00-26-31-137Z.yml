    - generic [ref=f2e10]: Hardware vs. Software
  - 'heading "Hardware vs. Software: The Digital Duo" [level=2] [ref=f2e11]'
  - paragraph [ref=f2e12]: Distinguishing the physical and logical layers of a computer.
  - generic [ref=f2e13]:
    - generic [ref=f2e14]:
      - heading "Hardware" [level=3] [ref=f2e15]
      - list [ref=f2e19]:
        - listitem [ref=f2e20]: "**Physical components:** Tangible parts of a computer."
        - listitem [ref=f2e21]: "**Examples:** CPU, RAM, hard drive, keyboard, monitor."
        - listitem [ref=f2e22]: "**Function:** Provides the basic platform and processing power."
        - listitem [ref=f2e23]: "**Nature:** Static, requires replacement for upgrades."
    - generic [ref=f2e24]:
      - heading "Software" [level=3] [ref=f2e25]
      - list [ref=f2e29]:
        - listitem [ref=f2e30]: "**Instructions & programs:** Logical components."
        - listitem [ref=f2e31]: "**Examples:** Operating systems, applications, drivers."
        - listitem [ref=f2e32]: "**Function:** Tells hardware what to do, provides functionality."
        - listitem [ref=f2e33]: "**Nature:** Dynamic, can be updated or changed easily."
  - generic [ref=f2e34]:
    - generic [ref=f2e35]:
      - 'heading "Example: Your Smartphone" [level=3] [ref=f2e36]'
      - paragraph [ref=f2e37]: The phone itself (screen, processor, battery) is hardware. The apps you download (Instagram, maps, games) are software.
    - generic [ref=f2e38]:
      - generic [ref=f2e39]: Key Takeaway
      - paragraph [ref=f2e40]: Hardware provides the physical foundation, while software gives the computer its functionality; they are interdependent.